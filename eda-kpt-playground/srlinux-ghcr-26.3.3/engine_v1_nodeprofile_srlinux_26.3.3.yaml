apiVersion: core.eda.nokia.com/v1
kind: NodeProfile
metadata:
  name: srlinux-ghcr-26.3.3
  namespace: eda # kpt-set: ${EDA_USER_NAMESPACE}
  labels:
    eda.nokia.com/bootstrap: "true"
spec:
  nodeUser: admin
  operatingSystem: srl
  platformPath: .platform.chassis.type
  port: 57400
  version: 26.3.3
  versionPath: .system.information.version
  versionMatch: v26\.3\.3.*
  yang: https://eda-asvr.eda-system.svc/_base_/schemaprofiles/srlinux-ghcr-26.3.3/srlinux-26.3.3.zip # kpt-set: https://eda-asvr.${EDA_CORE_NAMESPACE}.svc/_base_/schemaprofiles/srlinux-ghcr-26.3.3/srlinux-26.3.3.zip
  llmDb: https://eda-asvr.eda-system.svc/_base_/llm-dbs/llm-db-srlinux-ghcr-26.3.3/llm-embeddings-srl-26-3-3.tar.gz # kpt-set: https://eda-asvr.${EDA_CORE_NAMESPACE}.svc/_base_/llm-dbs/llm-db-srlinux-ghcr-26.3.3/llm-embeddings-srl-26-3-3.tar.gz
  dhcp:
    managementPoolv4: 'ipv4-mgmt-pool'
    dhcp4Options:
    - option: 6-DomainNameServer
      value:
      - 128.251.10.125
  license: cx-srl-26-3-3-ghcr-license
  images:
  - image: _base_/srlimages/srlinux-26.3.3-392
    imageMd5: _base_/srlimages/srlinux-26.3.3-392-md5
  containerImage: ghcr.io/nokia/srlinux:26.3.3-392 # kpt-set: ${SRL_26_3_3_GHCR}
  imagePullSecret: core # kpt-set: ${CORE_IMG_CREDENTIALS}
