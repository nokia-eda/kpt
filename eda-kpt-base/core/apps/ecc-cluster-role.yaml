apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eda-cert-checker-admin
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  - persistentvolumeclaims
  - pods
  - secrets
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes/proxy
  verbs:
  - get
- apiGroups:
  - cert-manager.io
  resources:
  - certificates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - certificates/status
  verbs:
  - get
- apiGroups:
  - certcheck.eda.nokia.com
  resources:
  - certificatechecks
  - dnschecks
  - volumechecks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - certcheck.eda.nokia.com
  resources:
  - certificatechecks/finalizers
  verbs:
  - update
- apiGroups:
  - certcheck.eda.nokia.com
  resources:
  - certificatechecks/status
  - dnschecks/status
  - volumechecks/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - core.eda.nokia.com
  resources:
  - engineconfigs
  - targetnodes
  verbs:
  - get
  - list
  - watch
